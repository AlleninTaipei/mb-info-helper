name: Monitor ASUS motherboard updates

on:
  schedule:
    - cron: "17 1,13 * * *"
  workflow_dispatch:
    inputs:
      send_test_email:
        description: "Send a test email without changing state"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: asus-motherboard-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: |
          python -m pip install --requirement requirements.txt
          python -m unittest discover -s tests -v

      - name: Check ASUS updates
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_STARTTLS: ${{ secrets.SMTP_STARTTLS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          if [[ "${{ inputs.send_test_email }}" == "true" ]]; then
            python monitor.py --test-email
          else
            python monitor.py
          fi

      - name: Commit updated state
        run: |
          if git diff --quiet -- data/state.json; then
            echo "State unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          git commit -m "chore: update ASUS monitoring state"
          git push
